name: Android checks and debug APKs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests, lint, and debug APKs
        run: gradle --no-daemon :shared:test :phone:testDebugUnitTest :tv:testDebugUnitTest :phone:lintDebug :tv:lintDebug :phone:assembleDebug :tv:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lan-cast-debug-apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.*
