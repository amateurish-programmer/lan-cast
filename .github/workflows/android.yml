name: Android checks and debug APKs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use runner Android SDK and required packages only
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu x64 image includes the Android SDK and command-line tools.
          # Do not run blanket license acceptance or install the retired tools package.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "Runner Android SDK manager is missing" >&2; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          missing=()
          test -f "$sdk/platforms/android-35/android.jar" || missing+=('platforms;android-35')
          test -x "$sdk/build-tools/35.0.0/aapt2" || missing+=('build-tools;35.0.0')
          if (( ${#missing[@]} )); then
            # Existing runner licenses apply. EOF declines any unexpected new agreement.
            "$sdkmanager" --sdk_root="$sdk" --install "${missing[@]}" < /dev/null
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/aapt2"
      - name: Tests, lint, and debug APKs
        run: gradle --no-daemon :shared:test :phone:testDebugUnitTest :tv:testDebugUnitTest :phone:lintDebug :tv:lintDebug :phone:assembleDebug :tv:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lan-cast-debug-apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.*
